<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareSupport — Test Chat (dev)</title>
  <style>
    :root { --bg:#f5f5f7; --assistant:#e9e9eb; --user:#0b93f6; --text:#1c1c1e; }
    * { box-sizing: border-box; }
    body {
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--text);
      height:100vh; display:flex; flex-direction:column;
    }
    header {
      padding:10px 16px; background:#fff; border-bottom:1px solid #ddd;
      display:flex; align-items:center; gap:10px; font-size:14px;
    }
    header b { font-size:15px; }
    header .env { background:#ffefc2; color:#7a5c00; padding:2px 8px; border-radius:999px; font-size:12px; }
    header .url { color:#888; font-size:12px; margin-left:auto; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    header button { font-size:12px; padding:3px 8px; border:1px solid #ccc; border-radius:6px; background:#fafafa; cursor:pointer; }
    #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
    .row { display:flex; }
    .row.user { justify-content:flex-end; }
    .bubble {
      max-width:70%; padding:9px 13px; border-radius:18px; font-size:15px;
      line-height:1.35; white-space:pre-wrap; word-wrap:break-word;
    }
    .user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:5px; }
    .assistant .bubble { background:var(--assistant); color:var(--text); border-bottom-left-radius:5px; }
    .thinking { opacity:.6; font-style:italic; }
    form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #ddd; }
    input[type=text] {
      flex:1; padding:11px 14px; border:1px solid #ccc; border-radius:20px; font-size:15px; outline:none;
    }
    input[type=text]:focus { border-color:var(--user); }
    button.send { padding:0 18px; border:none; border-radius:20px; background:var(--user); color:#fff; font-size:15px; cursor:pointer; }
    button.send:disabled { opacity:.5; cursor:default; }
    .empty { color:#999; text-align:center; margin-top:40px; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <b>CareSupport</b>
    <span class="env" id="envChip">test chat · dev</span>
    <span class="url" id="urlLabel"></span>
    <label style="font-size:12px;color:#555;display:flex;align-items:center;gap:4px;cursor:pointer" title="Send no timezone, like an iMessage user — lets you test the ask-for-location flow">
      <input type="checkbox" id="simSms" /> simulate iMessage (no tz)
    </label>
    <label style="font-size:12px;color:#555;display:flex;align-items:center;gap:4px;cursor:pointer" title="Send as the founder (sessionId = FOUNDER_PHONE), so dev_feedback + founder-feedback scores fire">
      <input type="checkbox" id="founderMode" /> 👑 founder
    </label>
    <button id="resetBtn" title="Start a fresh synthetic user">New session</button>
  </header>
  <div id="log"><div class="empty">Say hi to start a new care thread on the dev deployment.</div></div>
  <form id="composer">
    <input type="text" id="input" placeholder="Message…" autocomplete="off" autofocus />
    <button type="submit" class="send" id="sendBtn">Send</button>
  </form>

  <!-- Auto-generated by `npm run dev:chat` from .env.local; safe 404 if absent. -->
  <script src="convex-config.js"></script>
  <script type="module">
    import { ConvexClient } from "https://esm.sh/convex@1.32.0/browser";
    import { makeFunctionReference } from "https://esm.sh/convex@1.32.0/server";

    // URL precedence: ?url= override → auto-detected (convex-config.js, written
    // from .env.local by `npm run dev:chat`) → built-in fallback.
    const DEFAULT_CONVEX_URL = "https://trustworthy-echidna-807.convex.cloud";
    const CONVEX_URL =
      new URLSearchParams(location.search).get("url") ||
      window.CONVEX_URL ||
      DEFAULT_CONVEX_URL;
    document.getElementById("urlLabel").textContent = CONVEX_URL;

    const sendFn = makeFunctionReference("testChat:send");
    const listFn = makeFunctionReference("messages:listByCareCase");

    // Auto-detect the browser's IANA timezone (e.g. "America/New_York") so the
    // agent interprets times in the user's actual zone.
    const TIMEZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;
    document.getElementById("envChip").textContent = `test chat · dev · ${TIMEZONE}`;

    const client = new ConvexClient(CONVEX_URL);

    // Founder mode sends as FOUNDER_PHONE so the handler's isFounder gate trips
    // and dev_feedback / founder-feedback scoring fire. The client can't read
    // the server env var, so the value is configurable (?founder= or
    // window.FOUNDER_PHONE from convex-config.js) and defaults to the dev
    // synthetic number. Keep this in sync with FOUNDER_PHONE on the deployment.
    const FOUNDER_PHONE =
      new URLSearchParams(location.search).get("founder") ||
      window.FOUNDER_PHONE ||
      "+15550000001";

    // Stable synthetic "phone" per browser session.
    function newSession() {
      return "+1555" + Math.floor(1000000 + Math.random() * 8999999);
    }

    let founderMode = localStorage.getItem("cs_test_founder") === "1";
    // Separate storage per mode so the founder thread and a normal test user
    // don't clobber each other's session / care case.
    const sessionKey = () => (founderMode ? "cs_test_session_founder" : "cs_test_session");
    const careCaseKey = () => (founderMode ? "cs_test_carecase_founder" : "cs_test_carecase");

    let sessionId, careCaseId;
    function loadSession() {
      sessionId = founderMode
        ? FOUNDER_PHONE
        : localStorage.getItem(sessionKey()) || newSession();
      localStorage.setItem(sessionKey(), sessionId);
      careCaseId = localStorage.getItem(careCaseKey()) || null;
    }
    loadSession();

    const logEl = document.getElementById("log");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    let unsubscribe = null;
    let thinking = false;

    function render(messages) {
      const sorted = [...messages].sort((a, b) => a.timestamp - b.timestamp);
      logEl.innerHTML = "";
      if (sorted.length === 0 && !thinking) {
        logEl.innerHTML =
          '<div class="empty">Say hi to start a new care thread on the dev deployment.</div>';
        return;
      }
      for (const m of sorted) {
        const isUser = m.direction === "inbound";
        const row = document.createElement("div");
        row.className = "row " + (isUser ? "user" : "assistant");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.body;
        row.appendChild(bubble);
        logEl.appendChild(row);
      }
      if (thinking) {
        const row = document.createElement("div");
        row.className = "row assistant";
        row.innerHTML = '<div class="bubble thinking">…</div>';
        logEl.appendChild(row);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function subscribe() {
      if (unsubscribe) unsubscribe();
      if (!careCaseId) return;
      unsubscribe = client.onUpdate(listFn, { careCaseId }, render);
    }
    subscribe();

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text || thinking) return;
      inputEl.value = "";
      thinking = true;
      sendBtn.disabled = true;

      // Optimistic echo before the persisted row arrives over the subscription.
      const echo = document.createElement("div");
      echo.className = "row user";
      echo.innerHTML = '<div class="bubble"></div>';
      echo.querySelector(".bubble").textContent = text;
      if (logEl.querySelector(".empty")) logEl.innerHTML = "";
      logEl.appendChild(echo);
      const t = document.createElement("div");
      t.className = "row assistant";
      t.innerHTML = '<div class="bubble thinking">…</div>';
      logEl.appendChild(t);
      logEl.scrollTop = logEl.scrollHeight;

      try {
        const payload = { sessionId, messageBody: text };
        // Skip the timezone to mimic an iMessage user (no browser to detect it)
        // and exercise the agent's ask-for-location flow.
        if (!document.getElementById("simSms").checked) {
          payload.timezone = TIMEZONE;
        }
        const res = await client.action(sendFn, payload);
        if (res.careCaseId && res.careCaseId !== careCaseId) {
          careCaseId = res.careCaseId;
          localStorage.setItem(careCaseKey(), careCaseId);
          subscribe();
        }
      } catch (err) {
        alert("Send failed: " + (err?.message || err));
      } finally {
        thinking = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      // Only reset the active mode's thread.
      localStorage.removeItem(sessionKey());
      localStorage.removeItem(careCaseKey());
      location.reload();
    });

    // Founder-mode toggle: switch which synthetic sender we send as, swap to
    // that mode's thread, and make the state obvious in the header.
    const founderEl = document.getElementById("founderMode");
    function updateFounderChip() {
      const chip = document.getElementById("envChip");
      chip.textContent = `test chat · dev · ${TIMEZONE}` + (founderMode ? " · 👑 FOUNDER" : "");
      chip.style.background = founderMode ? "#ffd7d7" : "#ffefc2";
      chip.style.color = founderMode ? "#8a1c1c" : "#7a5c00";
    }
    founderEl.checked = founderMode;
    updateFounderChip();
    founderEl.addEventListener("change", () => {
      founderMode = founderEl.checked;
      localStorage.setItem("cs_test_founder", founderMode ? "1" : "0");
      loadSession();
      updateFounderChip();
      logEl.innerHTML =
        '<div class="empty">' +
        (founderMode
          ? "Founder mode — send feedback about CareSupport (tone/bug/feature/copy) to trigger dev_feedback + a founder-feedback score."
          : "Say hi to start a new care thread on the dev deployment.") +
        "</div>";
      subscribe();
      inputEl.focus();
    });
  </script>
</body>
</html>
